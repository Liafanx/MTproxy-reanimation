name: Сборка zapret2 bundle

on:
  workflow_dispatch:
    inputs:
      push_release:
        description: 'Опубликовать как Release?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Сборка ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    permissions:
      contents: write

    steps:
      - name: Подготовка QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Подготовка Buildx
        uses: docker/setup-buildx-action@v3

      - name: Создание Dockerfile
        shell: bash
        run: |
          cat > Dockerfile.zapret2 << 'DOCKEREOF'
          FROM debian:12-slim AS builder

          RUN apt-get update -qq && apt-get install -y -qq \
              build-essential git ca-certificates pkg-config \
              libz-dev libcap-dev \
              luajit libluajit-5.1-dev \
              libnetfilter-queue-dev libmnl-dev \
              && rm -rf /var/lib/apt/lists/*

          RUN cd /tmp && \
              git clone --depth=1 https://github.com/bol-van/zapret2.git && \
              cd zapret2 && \
              make -C nfq2 -j"$(nproc)" && \
              make -C mdig -j"$(nproc)" && \
              make -C ip2net -j"$(nproc)"

          RUN mkdir -p /out/opt/zapret2/bin /out/opt/zapret2/lua && \
              cp /tmp/zapret2/nfq2/nfqws2 /out/opt/zapret2/bin/ && \
              cp /tmp/zapret2/mdig/mdig /out/opt/zapret2/bin/ && \
              cp /tmp/zapret2/ip2net/ip2net /out/opt/zapret2/bin/ && \
              cp /tmp/zapret2/nfq2/lua/zapret-lib.lua /out/opt/zapret2/lua/ && \
              cp /tmp/zapret2/nfq2/lua/zapret-antidpi.lua /out/opt/zapret2/lua/ && \
              cp /tmp/zapret2/nfq2/lua/zapret-auto.lua /out/opt/zapret2/lua/ && \
              echo "zapret2 bundle $(date -u +%Y-%m-%d)" > /out/opt/zapret2/version && \
              chmod +x /out/opt/zapret2/bin/*

          RUN /out/opt/zapret2/bin/nfqws2 --version || true
          RUN ldd /out/opt/zapret2/bin/nfqws2 || true

          FROM scratch AS artifact
          COPY --from=builder /out /
          DOCKEREOF

      - name: Сборка ${{ matrix.arch }}
        shell: bash
        run: |
          mkdir -p out

          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --output type=local,dest=./out \
            -f Dockerfile.zapret2 .

          ARCHIVE="zapret2-bundle-linux-${{ matrix.arch }}.tar.gz"
          tar czf "${ARCHIVE}" -C out opt/zapret2

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: zapret2-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  release:
    name: Публикация Release
    needs: build
    if: github.event.inputs.push_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Скачать артефакты
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Показать файлы
        run: find artifacts -type f -maxdepth 3

      - name: Создать Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zapret2-bundle
          name: "Zapret2 bundle (nfqws2 + lua)"
          body: |
            ## zapret2 bundle для MTproxy-reanimation

            Содержит:
            - `nfqws2` — пакетный манипулятор
            - `mdig` — многопоточный ресолвер
            - `ip2net` — группировка IP в подсети
            - Lua библиотеки: `zapret-lib.lua`, `zapret-antidpi.lua`, `zapret-auto.lua`

            Используется модулем **Zapret2 MTProto fix by CHKRON** в MTproxy-reanimation.

            ### Архитектуры
            - `linux/amd64`
            - `linux/arm64`

            ### Установка
            MTproxy-reanimation скачивает и устанавливает автоматически через меню `[z]`.
          files: |
            artifacts/zapret2-amd64/*.tar.gz
            artifacts/zapret2-arm64/*.tar.gz
          draft: false
          prerelease: false
